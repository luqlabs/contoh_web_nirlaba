<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donasi - YayasanKita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Elegant Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          },
          colors: {
            brand: { 50: '#f4f8f9', 100: '#e3eff1', 500: '#0f4c5c', 600: '#0b3a46', 700: '#082b35' }, // Deep Teal
            trust: { 50:'#f8fafc', 100:'#f1f5f9', 500:'#64748b', 600:'#475569', 700:'#334155' }, // Muted slate for trust
            cream: '#fdfbf7', // Muted background
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #fdfbf7; color: #334155; }
    .subtle-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03); }
    /* Hide radio buttons but keep them functional */
    input[type="radio"] { display: none; }
    input[type="radio"]:checked + label {
      border-color: #0f4c5c;
      background-color: #f4f8f9;
      color: #082b35;
    }
    input[type="radio"]:checked + label .check-icon { display: block; }
  </style>
</head>
<body class="antialiased text-slate-700">

<!-- NAVBAR SIMPLE -->
<nav class="bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm sticky top-0 z-50 py-2">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
    <a href="homepage.html" class="flex items-center gap-3 font-serif font-bold text-2xl text-brand-700">
      <span class="w-10 h-10 rounded-lg bg-brand-500 flex items-center justify-center text-white text-lg font-serif">Y</span>
      YayasanKita
    </a>
    <a href="homepage.html" class="text-sm font-medium text-slate-500 hover:text-brand-600 transition-colors flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Kembali
    </a>
  </div>
</nav>

<!-- DONATION SECTION -->
<section class="py-16 md:py-24">
  <div class="max-w-3xl mx-auto px-4 sm:px-6">
    
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-5xl font-serif font-medium text-slate-800 mb-4">Salurkan Kebaikan</h1>
      <p class="text-slate-500 font-light text-lg">Setiap kontribusi Anda berarti besar bagi mereka yang menanti harapan.</p>
    </div>

    <div class="bg-white rounded-3xl subtle-shadow border border-slate-100 overflow-hidden">
      <div class="p-8 md:p-12">
        
        <form action="#" method="POST">
          
          <!-- STEP 1: Nominal -->
          <div class="mb-12">
            <h2 class="text-xl font-serif font-medium text-slate-800 mb-6 flex items-center gap-3">
              <span class="bg-brand-50 text-brand-600 w-8 h-8 rounded-full flex items-center justify-center text-sm font-sans font-bold">1</span>
              Pilih Nominal Donasi
            </h2>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-5">
              <!-- Preset 50k -->
              <div>
                <input type="radio" name="nominal" id="nom-50" value="50000" checked>
                <label for="nom-50" class="block w-full border-2 border-slate-100 rounded-xl p-5 text-center cursor-pointer transition-all hover:border-slate-300 relative">
                  <span class="block text-lg font-medium">Rp 50.000</span>
                  <svg class="check-icon hidden absolute top-3 right-3 w-5 h-5 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </label>
              </div>
              
              <!-- Preset 100k -->
              <div>
                <input type="radio" name="nominal" id="nom-100" value="100000">
                <label for="nom-100" class="block w-full border-2 border-slate-100 rounded-xl p-5 text-center cursor-pointer transition-all hover:border-slate-300 relative">
                  <span class="block text-lg font-medium">Rp 100.000</span>
                  <svg class="check-icon hidden absolute top-3 right-3 w-5 h-5 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </label>
              </div>

              <!-- Preset 500k -->
              <div>
                <input type="radio" name="nominal" id="nom-500" value="500000">
                <label for="nom-500" class="block w-full border-2 border-slate-100 rounded-xl p-5 text-center cursor-pointer transition-all hover:border-slate-300 relative">
                  <span class="block text-lg font-medium">Rp 500.000</span>
                  <svg class="check-icon hidden absolute top-3 right-3 w-5 h-5 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </label>
              </div>
            </div>

            <!-- Custom Input -->
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                <span class="text-slate-400 font-medium text-lg">Rp</span>
              </div>
              <input type="number" id="custom-nominal" placeholder="Nominal lainnya (Min. 10.000)" 
                     class="w-full pl-14 pr-5 py-4 rounded-xl border-2 border-slate-100 focus:border-brand-500 focus:ring-0 outline-none transition-colors text-lg font-medium text-slate-800 placeholder-slate-400 bg-slate-50 focus:bg-white">
            </div>
          </div>

          <!-- STEP 2: Data Diri -->
          <div class="mb-12">
            <h2 class="text-xl font-serif font-medium text-slate-800 mb-6 flex items-center gap-3">
              <span class="bg-brand-50 text-brand-600 w-8 h-8 rounded-full flex items-center justify-center text-sm font-sans font-bold">2</span>
              Informasi Donatur
            </h2>
            <div class="grid sm:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Nama Lengkap</label>
                <input type="text" required class="w-full px-5 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition-all bg-slate-50 focus:bg-white">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Email / No. WhatsApp</label>
                <input type="text" required class="w-full px-5 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition-all bg-slate-50 focus:bg-white">
              </div>
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-slate-600 mb-2">Pesan / Doa (Opsional)</label>
                <textarea rows="3" class="w-full px-5 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition-all bg-slate-50 focus:bg-white placeholder-slate-400" placeholder="Tuliskan doa untuk program ini..."></textarea>
              </div>
              <div class="sm:col-span-2 flex items-center gap-3 mt-1">
                <input type="checkbox" id="anonim" class="w-5 h-5 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                <label for="anonim" class="text-sm font-medium text-slate-600 cursor-pointer">Sembunyikan nama saya (Donasi Anonim)</label>
              </div>
            </div>
          </div>

          <!-- STEP 3: Pembayaran -->
          <div class="mb-10">
            <h2 class="text-xl font-serif font-medium text-slate-800 mb-6 flex items-center gap-3">
              <span class="bg-brand-50 text-brand-600 w-8 h-8 rounded-full flex items-center justify-center text-sm font-sans font-bold">3</span>
              Metode Pembayaran
            </h2>
            
            <div class="grid sm:grid-cols-2 gap-4">
              <!-- QRIS -->
              <div>
                <input type="radio" name="payment" id="pay-qris" value="qris" checked>
                <label for="pay-qris" class="flex items-center gap-4 w-full border-2 border-slate-100 rounded-xl p-4 cursor-pointer transition-all hover:border-slate-300">
                  <div class="w-14 h-10 bg-slate-100 rounded-lg flex items-center justify-center font-bold text-slate-600 text-xs">QRIS</div>
                  <div>
                    <span class="block font-medium text-slate-800">QRIS (Gopay, OVO)</span>
                    <span class="block text-xs font-light text-slate-500 mt-0.5">Verifikasi Instan</span>
                  </div>
                  <svg class="check-icon hidden ml-auto w-5 h-5 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </label>
              </div>

              <!-- VA Bank -->
              <div>
                <input type="radio" name="payment" id="pay-va" value="va_bank">
                <label for="pay-va" class="flex items-center gap-4 w-full border-2 border-slate-100 rounded-xl p-4 cursor-pointer transition-all hover:border-slate-300">
                  <div class="w-14 h-10 bg-slate-100 rounded-lg flex items-center justify-center font-bold text-slate-600 text-xs">BANK</div>
                  <div>
                    <span class="block font-medium text-slate-800">Transfer Virtual Account</span>
                    <span class="block text-xs font-light text-slate-500 mt-0.5">Semua Bank (Otomatis)</span>
                  </div>
                  <svg class="check-icon hidden ml-auto w-5 h-5 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </label>
              </div>
            </div>
          </div>

          <!-- SUBMIT -->
          <div class="mt-12 pt-8 border-t border-slate-100">
            <button type="button" onclick="alert('Terima kasih. Anda akan diarahkan ke halaman pembayaran otomatis.')" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-medium text-lg py-4 rounded-xl transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2">
              Lanjutkan Pembayaran — <span id="btn-amount" class="font-bold">Rp 50.000</span>
            </button>
            <p class="text-center text-sm font-light text-slate-500 mt-5 flex items-center justify-center gap-2">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              Transaksi Anda dilindungi enkripsi standar industri
            </p>
          </div>

        </form>
      </div>
    </div>
    
  </div>
</section>

<script>
  // Simple script to update button amount based on selection
  const radios = document.querySelectorAll('input[name="nominal"]');
  const customInput = document.getElementById('custom-nominal');
  const btnAmount = document.getElementById('btn-amount');

  radios.forEach(radio => {
    radio.addEventListener('change', (e) => {
      customInput.value = '';
      btnAmount.textContent = 'Rp ' + parseInt(e.target.value).toLocaleString('id-ID');
    });
  });

  customInput.addEventListener('input', (e) => {
    if(e.target.value) {
      radios.forEach(r => r.checked = false);
      btnAmount.textContent = 'Rp ' + parseInt(e.target.value).toLocaleString('id-ID');
    } else {
      document.getElementById('nom-50').checked = true;
      btnAmount.textContent = 'Rp 50.000';
    }
  });
</script>

</body>
</html>
